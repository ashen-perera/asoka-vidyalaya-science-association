<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030812" />
    <meta name="description" content="Explore the Asoka Vidyalaya Science Society, meet the committee, and register for events without an account." />
    <title>Asoka Science Society</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="scroll-telemetry" aria-hidden="true"><span></span></div>
    <canvas id="science-canvas" aria-hidden="true"></canvas>
    <div class="science-grid" aria-hidden="true">
      <span class="coordinate-drift"></span>
      <span class="radar-sweep"></span>
      <span class="telemetry telemetry-top">FIELD 01 <i></i> LIVE</span>
      <span class="telemetry telemetry-bottom">AV · SCIENCE / 06.5°N 79.9°E</span>
      <span class="telemetry telemetry-right">PARTICLE FIELD <i></i> ACTIVE</span>
      <svg class="orbital-mark" viewBox="0 0 100 100" focusable="false">
        <circle cx="50" cy="50" r="4" />
        <g class="orbital-forward"><ellipse cx="50" cy="50" rx="38" ry="15" /><ellipse cx="50" cy="50" rx="38" ry="15" transform="rotate(60 50 50)" /></g>
        <g class="orbital-reverse"><ellipse cx="50" cy="50" rx="38" ry="15" transform="rotate(120 50 50)" /></g>
      </svg>
      <svg class="oscilloscope" viewBox="0 0 180 32" focusable="false">
        <path class="scope-grid" d="M0 16h180M45 0v32M90 0v32M135 0v32" />
        <path class="scope-wave" d="M0 16h26l7-1 5-9 7 19 8-14 7 5h24l7-1 5-9 7 19 8-14 7 5h24l7-1 5-9 7 19 8-14 7 5h4" />
      </svg>
    </div>
    <div id="app"></div>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js" defer></script>
    <script src="app.js" defer></script>
    <script type="module" src="auth.js"></script>
  </body>
</html>
